# Runs the benchmarks and publishes the results page to GitHub Pages.
name: bench

on:
  push:
    branches: [main]
  schedule:
    # weekly, to pick up new toolchains and runner hardware
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer run supersedes an older one
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GitHub-hosted runners have 4 cores: 2 readers leave room for the writer
  # and the benchmark harness.
  RCU_BENCH_READERS: 2

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check that every adapter behaves like a cell
        run: cargo test --release

      - name: Run benchmarks
        run: cargo bench --bench cells

      - name: Build the results page
        run: |
          cargo run --release --bin report -- --json > site/results.json
          cargo run --release --bin report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: site

  pages:
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
