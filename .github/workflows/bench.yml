# Runs the benchmarks on several machines and publishes one results page to
# GitHub Pages.
name: bench

on:
  push:
    branches: [main]
  schedule:
    # weekly, to pick up new toolchains and runner hardware
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer run supersedes an older one
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The machines to measure on. GitHub-hosted x86_64 and arm64 always; a
  # self-hosted runner as well when the repository variable EXTRA_RUNNER names
  # its `runs-on` label (EXTRA_RUNNER_NAME sets how the page calls it).
  machines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          EXTRA_RUNNER: ${{ vars.EXTRA_RUNNER }}
          EXTRA_RUNNER_NAME: ${{ vars.EXTRA_RUNNER_NAME }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          machines = [
              {"id": "x86_64", "runs-on": "ubuntu-latest", "label": "x86_64 (GitHub)"},
              {"id": "aarch64", "runs-on": "ubuntu-24.04-arm", "label": "arm64 (GitHub)"},
          ]
          extra = os.environ.get("EXTRA_RUNNER", "").strip()
          if extra:
              label = os.environ.get("EXTRA_RUNNER_NAME", "").strip() or extra
              machines.append({"id": "extra", "runs-on": extra, "label": label})
          print("matrix=" + json.dumps({"include": machines}))
          PY

  bench:
    needs: machines
    name: bench-${{ matrix.id }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.machines.outputs.matrix) }}
    env:
      BENCH_MACHINE: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools (bare self-hosted images)
        run: |
          if ! command -v cc >/dev/null || ! command -v curl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential curl
          fi
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master@2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.id }}

      - name: Check that every adapter behaves like a cell
        run: cargo test --release

      - name: Run benchmarks
        run: cargo bench --bench cells

      - name: Collect results
        env:
          ID: ${{ matrix.id }}
        run: |
          cargo run --release --bin report -- --json > "results-$ID.json"
          cargo run --release --bin report >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.id }}
          path: results-${{ matrix.id }}.json
          if-no-files-found: error

  pages:
    needs: bench
    # publish whatever machines succeeded
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Merge the runs into one results file
        run: python3 scripts/merge_results.py site/results.json results/results-*.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
